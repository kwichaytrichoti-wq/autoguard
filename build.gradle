plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        autoguard {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation "org.ow2.asm:asm:9.7"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "${project.archives_base_name}-${project.version}-src.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        exclude '.gradle/**', 'build/**', '.idea/**', '*.iml'
    }
}

/**
 * Build-time mixin target verification.
 * <p>
 * Uses ASM to read the real Minecraft client jar (from Loom's runtime classpath) and
 * verifies that every string-based mixin reference really exists. Fails the build if any
 * target is missing, so a wrong annotation string (e.g. bad package in a @Redirect target)
 * cannot reach CI or a released jar.
 */
tasks.register('verifyMixins', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.autoguard.verify.MixinVerifier'

    // Find the Minecraft client jar on the runtime classpath.
    doFirst {
        def mcJar = sourceSets.main.runtimeClasspath.files.find { f ->
            f.name.startsWith('minecraft-') && f.name.endsWith('.jar') && f.isFile()
        }
        if (mcJar == null) {
            throw new GradleException("verifyMixins: could not find Minecraft client jar on runtime classpath")
        }
        args = [mcJar.absolutePath]
    }
}

// Run mixin verification as part of the normal build (after compile, before jar).
tasks.named('build') {
    dependsOn tasks.named('sourceArchive')
    dependsOn tasks.named('verifyMixins')
    // Ensure verification runs before the jar task so a broken mixin never gets packaged.
    tasks.named('jar') { dependsOn tasks.named('verifyMixins') }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
