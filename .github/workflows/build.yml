name: Build Smart Aim

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon clean build
        working-directory: smart-aim
      - name: Attach mod jar and source archive
        uses: actions/upload-artifact@v4
        with:
          name: smartaim-1.3.0
          path: |
            smart-aim/build/libs/smartaim-1.3.0.jar
            smart-aim/build/distributions/smartaim-1.3.0-src.zip
          if-no-files-found: error
