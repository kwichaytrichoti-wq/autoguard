name: Build AutoGuard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod and sources
        run: ./gradlew --no-daemon clean build
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: autoguard-1.0.5
          path: |
            build/libs/autoguard-1.0.5.jar
            build/libs/autoguard-1.0.5-sources.jar
            build/distributions/autoguard-1.0.5-src.zip
      - name: Publish build outputs to artifacts branch
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f build/libs/autoguard-1.0.5.jar build/libs/autoguard-1.0.5-sources.jar build/distributions/autoguard-1.0.5-src.zip
          git commit -m "ci: publish AutoGuard build outputs from ${GITHUB_SHA}" || echo "nothing new to commit"
          git push -f origin HEAD:artifacts
